name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src/mq

  unit-golden-property:
    runs-on: ubuntu-latest
    needs: lint-and-types
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/unit tests/golden tests/property -q

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-types
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq
          POSTGRES_DB: monsoonquant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mq -d monsoonquant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MQ_DATABASE_URL: postgresql+psycopg://mq:mq@localhost:5432/monsoonquant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run alembic -c src/mq/db/alembic.ini upgrade head
      - run: uv run pytest tests/integration -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web && pnpm run lint
      - run: cd web && pnpm run build

  # SPEC §9: "OpenAPI exported to web/lib/api/openapi.json in CI; TS
  # types generated with openapi-typescript (CI fails if stale)" --
  # regenerates both from the live FastAPI app object (no DB/server
  # needed for that) and fails the build if anything changed.
  web-openapi-drift:
    runs-on: ubuntu-latest
    needs: lint-and-types
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync
      - run: cd web && pnpm install --frozen-lockfile
      - run: make web-openapi-check

  # Playwright E2E against the real stack (SPEC §11) isn't wired into
  # CI yet -- it needs a seeded Postgres + a running uvicorn + a built
  # web/ all up together, more than this job's current services cover.
  # Not silently skipped: tracked in docs/STATUS.md's M13 section.

  # Added once core/ has a CMakeLists.txt (M5):
  # cpp-build-and-test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
