[project]
name = "monsoonquant"
version = "0.1.0"
description = "Prices, forecasts, explains and hedges India's exchange-traded rainfall futures. Research analytics, not trading advice."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Vijay BS" }]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "polars>=1.17",
    "pandera[polars]>=0.21",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "typer>=0.14",
    "structlog>=24.4",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "imdlib>=0.1.22",
    "requests>=2.34.2",
    "mlflow-skinny>=3.16.1",
    "scoringrules>=0.11.0",
    "mq-core-sim",
    "lightgbm>=4.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
mq = "mq.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-requests>=2.33.0.20260906",
    "scipy-stubs>=1.18.1.1",
    "pybind11>=2.13",
    "httpx2>=2.13",
]

[tool.uv.workspace]
# core/ is its own scikit-build-core + pybind11 project (see
# core/pyproject.toml) — kept separate from this hatchling-built pure-
# Python package so installing `mq` for analysis-only use never
# requires a C++ compiler. Wired in as a uv workspace member so
# `make bootstrap`/`uv sync` builds and installs the compiled
# extension alongside everything else, same as any other dependency.
members = ["core"]

[tool.uv.sources]
mq-core-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mq"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds reference specs (copied verbatim) with embedded Python
# snippets in fenced code blocks — never let ruff rewrite those.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented CLI-parameter idiom (typer.Argument(...)/typer.Option(...)
# as a default) is intentional, not the mutable-default-argument bug B008
# guards against.
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "fastapi.Query",
    "fastapi.Depends",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mq"]
mypy_path = "src"
exclude = ["^notebooks/", "^research/"]

[[tool.mypy.overrides]]
# No type stubs published for these packages. mq_core_sim is our own
# compiled pybind11 extension (core/) — no .pyi either, same situation.
module = ["imdlib.*", "scoringrules.*", "mq_core_sim"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/mq"]
